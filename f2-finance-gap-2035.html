<!doctype html>
<html lang="en" data-cgd-interactive-name="adaptation-gap-2026-f2-gap">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Adaptation finance gap in 2035</title>
<link rel="stylesheet" href="shared/cgd-figure.css?v=20261125a">
<link rel="stylesheet" href="shared/cgd-responsive.css?v=20261125a">
<link rel="stylesheet" href="shared/agr.css?v=20261125a">
<style>
  .scenario-control{flex:0 1 250px;min-width:0}
</style>
</head>
<body>
<div id="vizRoot" class="viz-wrapper">
  <div class="header-row">
    <div class="title-block"><h1 id="vizTitle">Even tripled, flows would meet under a third of 2035 adaptation needs</h1></div>
    <button class="fullscreen-btn" id="fullscreenBtn" type="button" aria-label="View fullscreen" data-tip="View fullscreen">
      <svg class="icon-expand" width="17" height="17" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M8 3H3v5M16 3h5v5M8 21H3v-5M21 16v5h-5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
      <svg class="icon-compress" width="17" height="17" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M8 3v5H3M16 3v5h5M8 21v-5H3M16 21v-5h5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </button>
  </div>

  <div class="controls" aria-label="Chart controls">
    <div class="control-group">
      <div class="control-label" id="groupLabel">Recipients</div>
      <div class="segmented" id="groupToggle" role="group" aria-labelledby="groupLabel">
        <button type="button" data-value="all" aria-pressed="true" data-tip="All developing countries">All developing</button>
        <button type="button" data-value="ldcsids" aria-pressed="false" data-tip="Least developed countries and small island developing States, combined">LDCs and SIDS</button>
      </div>
    </div>
    <div class="control-group scenario-control">
      <label for="scenarioSelect">Flows in 2035</label>
      <select id="scenarioSelect" class="plain-select">
        <option value="trip24">Triple 2024 flows</option>
        <option value="tripdbl" selected>Triple the 2025 doubling</option>
        <option value="uncond">Triple the doubling, plus domestic</option>
      </select>
    </div>
  </div>

  <section class="panel">
    <div class="panel-header">
      <h2 class="panel-title">US$ billion per year, 2035 prices</h2>
      <div class="legend" id="legend" aria-label="Legend"></div>
    </div>
    <div class="chart-area"><div class="chart-wrap" id="chartWrap"></div></div>
  </section>

  <div class="notes" id="notes"></div>
  <div class="tooltip" id="tooltip" role="tooltip" hidden></div>
</div>

<script src="shared/dom.js?v=20261125a"></script>
<script src="shared/chart-core.js?v=20261125a"></script>
<script src="shared/agr.js?v=20261125a"></script>
<script>
(() => {
  const { svgEl } = window.CGDDom;
  const { observeInlineSize, createSvg, getLayout } = window.CGDCore;
  const { usd, pct, renderNotes, segmented, legend, attachTip, hideTip, wireFullscreen, niceTicks } = window.AGR;

  /* UNEP AGR 2026, figures 2.7 (all developing countries) and 2.8 (LDCs and
     SIDS): needs and flows in 2035, in 2035 prices (3% annual inflation).
     Flow levels are cumulative: each scenario adds to the one before. */
  const GROUPS = {
    all: { short: 'All developing countries', needsLow: 420, needsHigh: 420, levels: { trip24: 85, tripdbl: 120, uncond: 189 } },
    ldcsids: { short: 'LDCs and SIDS', needsLow: 53, needsHigh: 71, levels: { trip24: 35, tripdbl: 44, uncond: 59 } }
  };
  const SCEN = [
    { key: 'trip24', label: 'Tripled 2024 flows', colour: '#2D99B5', text: '#fff',
      tip: 'International public adaptation finance in 2035 if 2024 flows are tripled' },
    { key: 'tripdbl', label: 'Extra from tripling the doubling', colour: '#6FBACB', text: '#1A272A',
      tip: 'Additional finance if the 2025 doubling target (about US$40bn) is met and then tripled' },
    { key: 'uncond', label: 'Domestic finance (indicative)', colour: '#FFB52C', text: '#1A272A',
      tip: 'Needs that countries mark as unconditional in NDCs and NAPs, as a rough guide to domestic public finance' }
  ];
  for (const g of Object.values(GROUPS)) {
    if (!(g.levels.trip24 < g.levels.tripdbl && g.levels.tripdbl < g.levels.uncond)) throw new Error('Flow levels must be cumulative');
  }

  const state = { group: 'all', scenario: 'tripdbl' };
  const wrap = document.getElementById('chartWrap');
  const select = document.getElementById('scenarioSelect');

  const range = (lo, hi, f) => lo === hi ? f(lo) : `${f(lo)}–${f(hi)}`;
  function gapText(g, level) {
    const hi = g.needsHigh - level, lo = Math.max(0, g.needsLow - level);
    if (lo === hi) return usd(hi, 0);
    if (lo === 0) return `up to ${usd(hi, 0)}`;
    return `US$${lo}–${hi}bn`;
  }
  function metText(g, level) {
    const lo = level / g.needsHigh, hi = Math.min(1, level / g.needsLow);
    return lo === hi ? pct(lo) : `${Math.round(lo * 100)}–${pct(hi)}`;
  }

  function renderLegend() {
    const g = GROUPS[state.group];
    const items = [{ key: 'needs', label: g.needsLow === g.needsHigh ? 'Needs' : 'Needs, lower estimate', colour: '#0B4C5B', toggle: false,
                     tip: 'Adaptation finance needs of developing countries in 2035' }];
    if (g.needsLow !== g.needsHigh) items.push({ key: 'range', label: 'Range to upper estimate', colour: '#BFDEE0', swatchClass: 'swatch-range', toggle: false,
                     tip: 'Needs range from the modelled estimate to countries’ own submissions' });
    SCEN.forEach(s => items.push({ ...s, toggle: false }));
    legend(document.getElementById('legend'), items, new Set(), () => {});
  }

  function renderText() {
    const g = GROUPS[state.group];
    document.getElementById('vizTitle').textContent = state.group === 'all'
      ? 'Even tripled, flows would meet under a third of 2035 adaptation needs'
      : 'Tripled flows would meet half or more of LDC and SIDS needs in 2035';
    const visible = state.group === 'all'
      ? ['Needs of US$420bn correspond to the report’s central estimate of US$305bn a year in 2024 prices.']
      : ['The needs range runs from the modelled estimate to countries’ own submissions.',
         'Group flows assume tripled finance reaches LDCs and SIDS in proportion to today, and some LDCs are also SIDS.'];
    renderNotes(document.getElementById('notes'), {
      visible,
      notes: ['All values are in 2035 prices, assuming 3% annual inflation.',
              'Domestic finance is indicative, based on the share of needs that countries mark as unconditional in their NDCs and NAPs.']
    });
  }

  function draw(width) {
    const g = GROUPS[state.group];
    const L = getLayout(width);
    const compact = L.name === 'compact';
    const height = compact ? 270 : 310;
    const labelW = compact ? 92 : 130;
    const m = { top: 14, right: labelW, bottom: 26, left: 34 };
    const { top, ticks } = niceTicks(Math.max(g.needsHigh, g.levels.uncond) * 1.04, compact ? 4 : 5);
    const plotW = width - m.left - m.right, plotH = height - m.top - m.bottom;
    const y = v => m.top + plotH - (v / top) * plotH;
    const barW = Math.min(90, Math.max(40, plotW * 0.3));
    const needsX = m.left + plotW * 0.27, flowsX = m.left + plotW * 0.78;

    const s = createSvg(wrap, width, height,
      `Bar chart comparing adaptation finance needs and flows in 2035 for ${g.short}`);
    const defs = svgEl('defs');
    const pat = svgEl('pattern', { id: 'agrHatch', width: 6, height: 6, patternUnits: 'userSpaceOnUse', patternTransform: 'rotate(45)' });
    pat.append(svgEl('rect', { width: 6, height: 6, fill: '#BFDEE0' }), svgEl('line', { x1: 0, y1: 0, x2: 0, y2: 6, stroke: '#0B4C5B', 'stroke-width': 2 }));
    defs.append(pat); s.append(defs);

    const axis = svgEl('g', { class: 'axis' });
    ticks.forEach(t => {
      axis.append(svgEl('line', { class: 'grid-line', x1: m.left, x2: m.left + plotW, y1: y(t), y2: y(t) }));
      const lab = svgEl('text', { x: m.left - 6, y: y(t) + 3.5, 'text-anchor': 'end', class: 'small-text' });
      lab.textContent = String(t); axis.append(lab);
    });
    axis.append(svgEl('line', { x1: m.left, x2: m.left + plotW, y1: y(0), y2: y(0), stroke: '#1A272A' }));
    [['Needs', needsX], ['Flows', flowsX]].forEach(([t, x]) => {
      const el = svgEl('text', { x, y: y(0) + 16, 'text-anchor': 'middle', class: 'small-text' });
      el.textContent = t; axis.append(el);
    });
    s.append(axis);

    // Needs column: solid to the lower estimate, hatched to the upper one.
    const ng = svgEl('g', { class: 'hit', tabindex: '0', role: 'img', 'aria-label': `Needs: ${range(g.needsLow, g.needsHigh, v => usd(v, 0))}` });
    const solid = svgEl('rect', { class: 'seg-mark', x: needsX - barW / 2, y: y(g.needsLow), width: barW, height: y(0) - y(g.needsLow) });
    solid.style.setProperty('--mark-fill', '#0B4C5B'); ng.append(solid);
    if (g.needsHigh > g.needsLow) {
      ng.append(svgEl('rect', { class: 'range-mark', x: needsX - barW / 2, y: y(g.needsHigh), width: barW, height: y(g.needsLow) - y(g.needsHigh) }));
      const lo = svgEl('text', { class: 'seg-label', x: needsX, y: y(g.needsLow) + 14, 'text-anchor': 'middle', fill: '#fff' });
      lo.textContent = String(g.needsLow); ng.append(lo);
    }
    const nl = svgEl('text', { class: 'bar-total', x: needsX, y: y(g.needsHigh) - 5, 'text-anchor': 'middle' });
    nl.textContent = String(g.needsHigh); ng.append(nl);
    attachTip(ng, () => ({ title: `${g.short}: needs in 2035`,
      rows: g.needsLow === g.needsHigh ? [['Central estimate', usd(g.needsHigh, 0)]]
                                       : [['Lower estimate', usd(g.needsLow, 0)], ['Upper estimate', usd(g.needsHigh, 0)]] }));
    s.append(ng);

    // Flows column: cumulative scenario layers; layers above the selection are dimmed.
    const selIdx = SCEN.findIndex(sc => sc.key === state.scenario);
    let base = 0;
    SCEN.forEach((sc, i) => {
      const lvl = g.levels[sc.key];
      const fg = svgEl('g', { class: 'hit', tabindex: '0', role: 'img', 'aria-label': `${sc.label}: flows reach ${usd(lvl, 0)}` });
      const r = svgEl('rect', { class: 'seg-mark' + (i > selIdx ? ' dim' : ''), x: flowsX - barW / 2, y: y(lvl), width: barW, height: y(base) - y(lvl) });
      r.style.setProperty('--mark-fill', sc.colour); fg.append(r);
      if (y(base) - y(lvl) >= 13 && i <= selIdx) {
        const t = svgEl('text', { class: 'seg-label', x: flowsX, y: y(lvl) + 12, 'text-anchor': 'middle', fill: sc.text });
        t.textContent = String(lvl); fg.append(t);
      }
      const prev = base;
      attachTip(fg, () => ({ title: sc.label, rows: [
        [i === 0 ? 'Flows' : 'Adds', usd(lvl - prev, 0)],
        ['Flows reach', usd(lvl, 0)],
        ['Gap to needs', gapText(g, lvl)],
        ['Share of needs met', metText(g, lvl)]
      ] }));
      s.append(fg);
      base = lvl;
    });

    // Gap: from the selected flow level up to the (upper) needs estimate.
    const level = g.levels[state.scenario];
    const ax = flowsX + barW / 2 + 9;
    const gg = svgEl('g', { class: 'gap' });
    gg.append(svgEl('line', { class: 'gap-line', x1: needsX + barW / 2, x2: ax + 4, y1: y(g.needsHigh), y2: y(g.needsHigh) }));
    gg.append(svgEl('line', { class: 'gap-arrow', x1: ax, x2: ax, y1: y(g.needsHigh), y2: y(level) - 1 }));
    gg.append(svgEl('path', { class: 'gap-arrow', d: `M${ax - 4},${y(level) - 6} L${ax},${y(level) - 1} L${ax + 4},${y(level) - 6}` }));
    const midY = (y(g.needsHigh) + y(level)) / 2;
    const t1 = svgEl('text', { class: 'gap-sub', x: ax + 8, y: midY - 14 }); t1.textContent = 'Gap';
    const t2 = svgEl('text', { class: 'gap-label', x: ax + 8, y: midY + 1 }); t2.textContent = gapText(g, level);
    const t3 = svgEl('text', { class: 'gap-sub', x: ax + 8, y: midY + 15 }); t3.textContent = `${metText(g, level)} met`;
    gg.append(t1, t2, t3);
    s.append(gg);
  }

  function render() {
    hideTip();
    renderLegend();
    renderText();
    draw(Math.max(280, Math.floor(wrap.getBoundingClientRect().width) || 600));
  }

  segmented('groupToggle', v => {
    state.group = v;
    window.CGDTracking?.engagement('filter', 'recipient_group', v);
    render();
  });
  select.addEventListener('change', () => {
    state.scenario = select.value;
    window.CGDTracking?.engagement('filter', 'flow_scenario', select.value);
    render();
  });
  wireFullscreen();
  render();
  observeInlineSize(wrap, w => draw(Math.max(280, w)));
  (document.fonts?.ready || Promise.resolve()).then(() => { render(); window.CGD_READY = true; });
})();
</script>
<script src="shared/cgd-embed.js?v=20261125a"></script>
</body>
</html>
